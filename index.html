<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Kinect · Book a demo</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff;color:#262626;font:16px/1.6 system-ui,sans-serif}main{max-width:30rem;padding:2rem}h1{font-size:28px;letter-spacing:-1px}a{color:inherit;text-underline-offset:4px}p{color:#555}</style>
</head><body><main><h1>Kinect</h1><p id="status">Opening your demo link…</p><a id="continue" href="https://trykinect.ai/qr">Continue to book a demo</a><noscript><p>Enable JavaScript to follow the current destination automatically.</p></noscript></main>
<script>
(async()=>{
 try{
  const response=await fetch('./destination.json?v='+Date.now(),{cache:'no-store'});
  if(!response.ok)throw new Error('Unavailable');
  const config=await response.json();
  const destination=new URL(config.destination);
  if(destination.protocol!=='https:' || destination.username || destination.password)throw new Error('Invalid destination');
  document.getElementById('continue').href=destination.href;
  window.location.replace(destination.href);
 }catch{
  document.getElementById('status').textContent='Your demo link is ready below.';
 }
})();
</script></body></html>
